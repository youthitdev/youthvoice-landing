<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바람직한 실패작 모음집 · 작가들에게 한마디</title>
<meta name="description" content="북토크를 마치며 학교 밖 청소년 작가들에게 응원을 남기는 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --cover:#22304F;      /* 책 뒤표지 */
  --cover-deep:#18233B;
  --foil:#E2B34A;       /* 금박 */
  --page:#F3F1E8;
  --ink:#1F2A44;
  --soft:#AEB8CC;
  --rule:rgba(226,179,74,.35);
  --focus:#8FB4FF;
  --serif:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--cover);color:var(--page);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
button,textarea{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
.demo{background:#3A4A6E;color:var(--page);font-size:14px;padding:8px 12px;border-radius:4px;margin:0 0 20px}

.book{font-family:var(--serif);font-size:15px;color:var(--foil);margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.3;margin:0;word-break:keep-all}
.lede{color:var(--soft);margin:14px 0 0;max-width:30em}

.compose{margin:32px 0 44px;background:var(--page);color:var(--ink);border-radius:4px;padding:18px 18px 16px}
.compose label{display:block;font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:8px}
textarea{
  width:100%;min-height:6.5em;resize:vertical;border:0;background:transparent;color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.8;padding:0;outline-offset:6px;
}
textarea::placeholder{color:#8C93A0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.counter{font-size:14px;color:#6A7282}
.counter.over{color:#C0392B}
.btn{border:0;background:var(--foil);color:var(--cover-deep);border-radius:4px;padding:11px 18px;font-size:16px;cursor:pointer}
.btn.dark{background:var(--ink);color:var(--page)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--soft);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--page)}
.compose .linkbtn{color:#6A7282}

h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:0 0 6px}
.status{color:#F2A3A3;font-size:14px;min-height:1em;margin:0 0 6px}
.blurb{position:relative;padding:22px 0 20px 34px;border-top:1px solid var(--rule)}
.blurb::before{content:'\201C';position:absolute;left:0;top:10px;font-family:var(--serif);font-size:54px;line-height:1;color:var(--foil)}
.blurb .text{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.blurb .sig{margin-top:8px;font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.blurb .mine{color:var(--cover-deep);background:var(--foil);border-radius:3px;padding:0 6px}
.blurb.editing{background:var(--page);color:var(--ink);border-radius:4px;padding:16px 16px 14px 16px;border-top:0;margin:8px 0}
.blurb.editing::before{display:none}
@keyframes arrive{from{background:rgba(226,179,74,.18)}to{background:transparent}}
.blurb.fresh{animation:arrive 2.4s ease-out both}
.empty{color:var(--soft);border:1px dashed var(--rule);border-radius:4px;padding:28px;text-align:center}
footer.host{margin-top:48px;font-size:14px;color:var(--soft)}
footer.host a{color:var(--soft)}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--page);color:var(--ink);padding:10px 16px;border-radius:4px;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 발표 화면 잠금 ===== */
.gate{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.locked .wrap,body.locked .screen{display:none !important}
body.locked .gate{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px}
.gate-box{width:min(360px,100%);background:var(--page);color:var(--ink);border-radius:4px;padding:26px 24px 18px}
.gate-box h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.gate-box p{margin:0 0 16px;color:#5E6878}
.gate-box input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid #D3D6DD;border-radius:4px;background:#fff;color:var(--ink);margin-bottom:12px}
.gate-box .btn{width:100%}
.gate-box .gate-msg{min-height:1.4em;margin:12px 0 0;font-size:14px}

/* ===== 발표 화면 ===== */
.screen{display:none}
body.is-screen .wrap{display:none}
body.is-screen .screen{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;padding:28px 44px 24px}
.screen-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.screen-top .book{border:0;margin:0;padding:0;font-size:clamp(16px,1.4vw,22px)}
.screen-top h1{font-size:clamp(28px,2.6vw,44px)}
.tally{font-family:var(--serif);font-size:clamp(18px,1.6vw,26px);color:var(--soft);white-space:nowrap}
.tally b{color:var(--foil);font-size:1.5em}
.stage{display:grid;place-items:center;padding:20px 0}
.spot{max-width:1100px;width:100%;position:relative;padding-left:clamp(50px,6vw,100px);transition:opacity .45s}
.spot.out{opacity:0}
.spot::before{content:'\201C';position:absolute;left:0;top:-.15em;font-family:var(--serif);font-size:clamp(90px,10vw,180px);line-height:1;color:var(--foil)}
.spot .text{font-family:var(--serif);font-size:clamp(30px,3.6vw,60px);line-height:1.6;margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.spot.long .text{font-size:clamp(24px,2.5vw,40px)}
.spot.longer .text{font-size:clamp(19px,1.8vw,30px)}
.stage{overflow:auto}
.spot .sig{margin-top:20px;font-size:clamp(16px,1.4vw,22px);color:var(--soft)}
.screen-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.controls .btn{font-size:16px;padding:10px 16px}
.controls .ghost{background:transparent;color:var(--page);border:1px solid var(--rule)}
.join{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--soft);line-height:1.4}
.join #qr{background:var(--page);padding:6px;border-radius:3px;line-height:0}
.join #qr img,.join #qr canvas{width:104px;height:104px}
@media (max-width:900px){ .join{display:none} body.is-screen .screen{padding:20px} }
@media (prefers-reduced-motion:reduce){ .spot,.toast{transition:none} .blurb.fresh{animation:none} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="book">&lt;바람직한 실패작 모음집&gt; 북토크</p>
    <h1>작가들에게 건네는 한마디</h1>
    <p class="lede">오늘 만난 학교 밖 청소년 작가들에게 응원을 남겨 주세요. 이름은 남지 않고, 작가들에게 그대로 전해집니다.</p>
  </header>

  <form class="compose" id="compose">
    <label for="draft">응원 한마디</label>
    <textarea id="draft" placeholder="예) 실패를 이렇게 솔직하게 쓸 수 있다는 게 멋졌어요. 다음 책도 기다릴게요."></textarea>
    <div class="row">
      <span class="counter" id="counter">0자</span>
      <button class="btn dark" id="submit" type="submit">응원 보내기</button>
    </div>
  </form>

  <section aria-labelledby="list-title">
    <h2 id="list-title">도착한 응원 <span class="count">0</span>개</h2>
    <p class="status" id="status" role="status"></p>
    <div id="list"></div>
  </section>
</div>

<div class="screen" id="screen">
  <div class="screen-top">
    <div>
      <p class="book">&lt;바람직한 실패작 모음집&gt; 북토크</p>
      <h1>작가들에게 건네는 한마디</h1>
    </div>
    <div class="tally">도착한 응원 <b class="count">0</b>개</div>
  </div>
  <div class="stage">
    <figure class="spot" id="spot" aria-live="polite" style="margin:0">
      <p class="text" id="spotText"></p>
      <figcaption class="sig" id="spotSig"></figcaption>
    </figure>
  </div>
  <div class="screen-bottom">
    <div class="controls">
      <button class="btn ghost" id="prev" type="button">이전</button>
      <button class="btn ghost" id="pause" type="button">멈춤</button>
      <button class="btn ghost" id="next" type="button">다음</button>
      <button class="btn ghost" id="fullscreen" type="button">전체 화면</button>
      <button class="linkbtn" id="adminDel" type="button">관리자 삭제</button>
    </div>
    <div class="join"><span>휴대폰으로<br>응원 남기기</span><div id="qr"></div></div>
  </div>
</div>

<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <h2>발표 화면</h2>
    <p>진행자용 화면이에요. 관리자 코드를 입력해 주세요.</p>
    <label for="gateCode" class="sr">관리자 코드</label>
    <input type="password" id="gateCode" autocomplete="current-password" placeholder="관리자 코드">
    <button class="btn dark" type="submit">열기</button>
    <p class="gate-msg" id="gateMsg" role="status"></p>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ 설정: 여기만 바꾸세요 ============ */
const CONFIG = {
  SUPABASE_URL: "https://YOUR-PROJECT.supabase.co",
  SUPABASE_ANON_KEY: "YOUR-ANON-OR-PUBLISHABLE-KEY",
};
const ROTATE_SECONDS = 7;   // 발표 화면에서 한 응원을 보여주는 시간
/* ============================================ */

const BOARD = "cheer", MAX = 5000;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const SCREEN = new URLSearchParams(location.search).has("screen");
const DEMO = !/^https:\/\//.test(CONFIG.SUPABASE_URL) || CONFIG.SUPABASE_URL.includes("YOUR-PROJECT");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16);
  });
}
const TOKEN = store.get("booktalk.token") || (() => { const t = uuid(); store.set("booktalk.token", t); return t; })();

async function rest(path, body){
  const headers = { apikey: CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  if (CONFIG.SUPABASE_ANON_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + CONFIG.SUPABASE_ANON_KEY;
  const res = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path, {
    method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){}
  if (!res.ok) throw new Error((data && data.message) || "서버에 연결하지 못했어요 (" + res.status + ")");
  return data;
}
const remoteApi = {
  list: b => rest("booktalk_posts?select=id,no,content,created_at,updated_at&board=eq." + b + "&order=created_at.desc&limit=1000"),
  create: (b, c) => rest("rpc/booktalk_create", { p_board: b, p_content: c, p_token: TOKEN }),
  update: (id, c) => rest("rpc/booktalk_update", { p_id: id, p_content: c, p_token: TOKEN }),
  remove: id => rest("rpc/booktalk_delete", { p_id: id, p_token: TOKEN }),
  adminRemove: (id, code) => rest("rpc/booktalk_admin_delete", { p_id: id, p_code: code }),
};
const demoApi = {
  all(){ return store.get("booktalk.demo", []); },
  async list(b){
    return this.all().filter(p => p.board === b)
      .sort((a, c) => c.created_at.localeCompare(a.created_at))
      .map(({ owner_token, board, ...p }) => p);
  },
  async create(b, c){
    const all = this.all();
    const no = all.filter(p => p.board === b).reduce((m, p) => Math.max(m, p.no), 0) + 1;
    const p = { id: uuid(), board: b, no, content: c, owner_token: TOKEN, created_at: new Date().toISOString(), updated_at: null };
    all.push(p); store.set("booktalk.demo", all); return { id: p.id, no };
  },
  async update(id, c){
    const all = this.all(), p = all.find(x => x.id === id && x.owner_token === TOKEN);
    if (!p) throw new Error("이 기기에서 쓴 글만 수정할 수 있어요");
    p.content = c; p.updated_at = new Date().toISOString(); store.set("booktalk.demo", all); return true;
  },
  async remove(id){ store.set("booktalk.demo", this.all().filter(x => !(x.id === id && x.owner_token === TOKEN))); return true; },
  async adminRemove(id){ store.set("booktalk.demo", this.all().filter(x => x.id !== id)); return true; },
};
const api = DEMO ? demoApi : remoteApi;

const state = { posts: [], seen: new Set(), loaded: false, editing: null, sig: "" };
const mine = new Set(store.get("booktalk.mine", []));
const saveMine = () => store.set("booktalk.mine", [...mine]);

function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s/60) + "분 전";
  if (s < 86400) return Math.floor(s/3600) + "시간 전";
  const d = new Date(iso); return (d.getMonth()+1) + "월 " + d.getDate() + "일";
}
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

if (SCREEN) document.body.classList.add("is-screen");

async function refresh(){
  if (state.editing) return;
  try{
    const posts = await api.list(BOARD) || [];
    $("#status").textContent = "";
    const sig = JSON.stringify(posts.map(p => [p.id, p.content, p.updated_at]));
    if (state.loaded && sig === state.sig) return;
    const fresh = state.loaded ? posts.filter(p => !state.seen.has(p.id)) : [];
    state.sig = sig; state.posts = posts;
    if (SCREEN) onScreenUpdate(fresh); else render();
    posts.forEach(p => state.seen.add(p.id));
    state.loaded = true;
  }catch(e){
    $("#status").textContent = "목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
  }
}

/* ---- 참여 화면 ---- */
function render(){
  $$(".count").forEach(c => c.textContent = state.posts.length);
  const box = $("#list");
  if (!state.posts.length){ box.replaceChildren(el("div", "empty", "아직 도착한 응원이 없어요. 첫 번째 한마디를 남겨 주세요.")); return; }
  box.replaceChildren(...state.posts.map(blurb));
}
function blurb(p){
  const fresh = state.loaded && !state.seen.has(p.id);
  const a = el("article", "blurb" + (fresh ? " fresh" : ""));
  a.dataset.id = p.id;

  if (state.editing === p.id){
    a.classList.add("editing");
    const ta = el("textarea"); ta.value = p.content; ta.setAttribute("aria-label", "응원 수정");
    const cnt = el("span", "counter");
    const upd = () => { cnt.textContent = ta.value.trim().length + "자"; cnt.classList.toggle("over", ta.value.trim().length > MAX); };
    ta.addEventListener("input", upd); upd();
    const save = el("button", "btn dark", "수정 저장"); save.type = "button";
    const cancel = el("button", "linkbtn", "취소"); cancel.type = "button"; cancel.style.color = "#6A7282";
    save.onclick = async () => {
      const v = ta.value.trim();
      if (!v) return toast("내용을 입력해 주세요");
      if (v.length > MAX) return toast(MAX + "자 이내로 줄여 주세요");
      save.disabled = true;
      try{ await api.update(p.id, v); state.editing = null; toast("수정했어요"); await refresh(); }
      catch(e){ toast(e.message); save.disabled = false; }
    };
    cancel.onclick = () => { state.editing = null; render(); };
    const right = el("span"); right.append(cancel, document.createTextNode(" "), save);
    const row = el("div", "row"); row.append(cnt, right);
    a.append(ta, row);
    setTimeout(() => ta.focus(), 0);
    return a;
  }

  a.appendChild(el("p", "text", p.content));
  const sig = el("div", "sig");
  sig.appendChild(el("span", "", "익명의 독자, " + ago(p.created_at) + (p.updated_at ? " (수정됨)" : "")));
  if (mine.has(p.id)){
    sig.appendChild(el("span", "mine", "내 글"));
    const e = el("button", "linkbtn", "수정"); e.type = "button";
    const d = el("button", "linkbtn", "삭제"); d.type = "button";
    e.onclick = () => { state.editing = p.id; render(); };
    d.onclick = async () => {
      if (!confirm("이 응원을 삭제할까요? 되돌릴 수 없어요.")) return;
      try{ await api.remove(p.id); mine.delete(p.id); saveMine(); toast("삭제했어요"); await refresh(); }
      catch(err){ toast(err.message); }
    };
    sig.append(e, d);
  }
  a.appendChild(sig);
  return a;
}

const draft = $("#draft");
function updateCounter(){
  const n = draft.value.trim().length;
  $("#counter").textContent = n + "자";
  $("#counter").classList.toggle("over", n > MAX);
}
draft.addEventListener("input", updateCounter);
$("#compose").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = draft.value.trim();
  if (!text) { toast("내용을 입력해 주세요"); draft.focus(); return; }
  if (text.length > MAX) { toast(MAX + "자 이내로 줄여 주세요"); return; }
  const btn = $("#submit"); btn.disabled = true;
  try{
    const r = await api.create(BOARD, text);
    mine.add(r.id); saveMine();
    draft.value = ""; updateCounter();
    toast("응원을 보냈어요");
    await refresh();
  }catch(e){ toast(e.message || "보내지 못했어요. 다시 시도해 주세요."); }
  finally{ btn.disabled = false; }
});

/* ---- 발표 화면 잠금 ---- */
const ADMIN_KEY = "booktalk.admin";
const ss = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} },
};
async function checkAdmin(code){
  if (DEMO) return !!code;
  return (await rest("rpc/booktalk_admin_check", { p_code: code })) === true;
}
function gate(onOpen){
  document.body.classList.add("locked");
  const form = $("#gateForm"), input = $("#gateCode"), msg = $("#gateMsg");
  const unlock = () => { document.body.classList.remove("locked"); onOpen(); };
  if (DEMO) msg.textContent = "미리보기에서는 아무 코드나 입력하면 열려요.";
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const code = input.value.trim();
    if (!code) { input.focus(); return; }
    const btn = form.querySelector("button"); btn.disabled = true; msg.textContent = "확인하는 중이에요";
    try{
      if (await checkAdmin(code)) { ss.set(ADMIN_KEY, code); unlock(); }
      else { msg.textContent = "관리자 코드가 맞지 않아요."; input.select(); }
    }catch(e){ msg.textContent = e.message; }
    finally{ btn.disabled = false; }
  });
  const saved = ss.get(ADMIN_KEY);
  if (saved) checkAdmin(saved).then(ok => { if (ok) unlock(); else { ss.del(ADMIN_KEY); input.focus(); } }).catch(() => input.focus());
  else input.focus();
}

/* ---- 발표 화면: 한 문장씩 크게 ---- */
const spot = { id: null, queue: [], paused: false, timer: null };
function onScreenUpdate(fresh){
  $$(".count").forEach(c => c.textContent = state.posts.length);
  fresh.slice().reverse().forEach(p => spot.queue.push(p.id));   // 새로 온 응원은 먼저 보여주기
  const current = state.posts.find(p => p.id === spot.id);
  if (!current) { spot.id = null; advance(1); }
  else showSpot(current, false);
}
function showSpot(p, animate){
  const box = $("#spot");
  const fill = () => {
    if (!p) { $("#spotText").textContent = "첫 번째 응원을 기다리고 있어요"; $("#spotSig").textContent = "QR 코드로 들어와 한마디를 남겨 주세요"; return; }
    $("#spotText").textContent = p.content;
    box.classList.toggle("long", p.content.length > 90);
    box.classList.toggle("longer", p.content.length > 250);
    $("#spotSig").textContent = "익명의 독자";
  };
  if (!animate || REDUCED) { fill(); return; }
  box.classList.add("out");
  setTimeout(() => { fill(); box.classList.remove("out"); }, 450);
}
function advance(d){
  const posts = state.posts;
  if (!posts.length) { spot.id = null; showSpot(null, false); return; }
  let next = null;
  while (d > 0 && spot.queue.length && !next) next = posts.find(p => p.id === spot.queue.shift()) || null;
  if (!next){
    const i = posts.findIndex(p => p.id === spot.id);
    next = posts[(i + d + posts.length) % posts.length];
    if (i < 0) next = posts[0];
  }
  spot.id = next.id; showSpot(next, true);
}
function restartTimer(){
  clearInterval(spot.timer);
  if (!spot.paused) spot.timer = setInterval(() => advance(1), ROTATE_SECONDS * 1000);
}
if (SCREEN){
  $("#next").onclick = () => { advance(1); restartTimer(); };
  $("#prev").onclick = () => { advance(-1); restartTimer(); };
  $("#pause").onclick = () => { spot.paused = !spot.paused; $("#pause").textContent = spot.paused ? "재생" : "멈춤"; restartTimer(); };
  $("#fullscreen").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  $("#adminDel").onclick = async () => {
    const id = spot.id; if (!id) return;
    let code = ss.get(ADMIN_KEY);
    if (!code) { code = prompt("관리자 코드를 입력하세요"); if (!code) return; }
    if (!confirm("지금 보이는 응원을 모든 화면에서 삭제할까요?")) return;
    try{ await api.adminRemove(id, code); ss.set(ADMIN_KEY, code); toast("삭제했어요"); await refresh(); }
    catch(e){ ss.del(ADMIN_KEY); toast(e.message); }
  };
  document.addEventListener("keydown", ev => {
    if (document.body.classList.contains("locked") || ev.target.matches("textarea,input")) return;
    if (ev.key === "ArrowRight") $("#next").click();
    else if (ev.key === "ArrowLeft") $("#prev").click();
    else if (ev.key === " ") { ev.preventDefault(); $("#pause").click(); }
  });
}

function start(){
  if (SCREEN){
    if (window.QRCode){
      new QRCode($("#qr"), { text: location.origin + location.pathname, width: 208, height: 208, colorDark: "#18233B", colorLight: "#F3F1E8" });
    }
    showSpot(null, false);
    restartTimer();
  }
  refresh();
  setInterval(refresh, SCREEN ? 4000 : 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
if (SCREEN) gate(start); else start();
</script>
